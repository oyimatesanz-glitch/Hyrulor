[package]
name = "hyrulor-cosmic-applet"
version = "0.3.0"
edition = "2021"
rust-version = "1.93"
license = "MIT"
description = "Native COSMIC panel applet for Hyrulor"
default-run = "hyrulor-cosmic-applet"

[[bin]]
name = "hyrulor-cosmic-applet"
path = "src/main.rs"

[[bin]]
name = "hyrulor-mock-daemon"
path = "src/bin/mock_daemon.rs"

[dependencies]
# COSMIC applet runtime. Keep Cargo.lock in source control to pin its exact Git revision.
libcosmic = { git = "https://github.com/pop-os/libcosmic.git", default-features = false, features = ["applet"] }
futures = "=0.3.34"
libc = "=0.2.191"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
tokio = { version = "=1.54.1", features = ["macros", "rt-multi-thread", "net", "io-util", "time", "sync"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
